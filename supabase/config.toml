# =============================================================================
# GymBuddy Supabase Local & Project Configuration
# =============================================================================
project_id = "gymbuddy-eu-mvp"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
ip_version = "IPv4"
max_header_length = 4096

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[storage]
enabled = true
file_size_limit = "15MiB"

[storage.buckets.profile-originals]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/heic"]

[storage.buckets.post-originals]
public = false
file_size_limit = "15MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/heic"]

[storage.buckets.message-attachments]
public = false
file_size_limit = "15MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/heic"]

[storage.buckets.media-variants]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["image/jpeg", "image/webp"]

[auth]
enabled = true
site_url = "https://gymbuddy.app"
additional_redirect_urls = ["gymbuddy://auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_users = false
minimum_password_length = 12

[auth.external.apple]
enabled = true
client_id = "env(APPLE_CLIENT_ID)"
secret = "env(APPLE_PRIVATE_KEY)"
